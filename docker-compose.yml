services:
  mysql:
    image: mysql:8
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - todo-mysql-data:/var/lib/mysql

volumes:
  todo-mysql-data:
